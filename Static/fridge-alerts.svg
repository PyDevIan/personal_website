<svg xmlns="http://www.w3.org/2000/svg" width="720" height="600" viewBox="0 0 720 600" role="img" aria-labelledby="title desc"><title id="title">Fridge Alert Notification System</title><desc id="desc">Recorder alert emails trigger Teams notifications, FastAPI acknowledgments, and escalation or closure, with structured CSV audit logs.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#6fc4d9" stroke-width="1.4"/></marker></defs><rect width="720" height="600" rx="22" fill="#0c1520"/><g font-family="Segoe UI, Arial, sans-serif"><text x="52" y="43" font-size="12" letter-spacing="2" fill="#89d5ed">WORKFLOW AUTOMATION</text><text x="52" y="74" font-size="23" font-weight="600" fill="#edf5ff">Workflow overview</text><rect x="52" y="100" width="616" height="92" rx="15" fill="#142030" stroke="#365166"/><text x="78" y="131" fill="#89d5ed" font-size="13" font-weight="700">01</text><text x="119" y="135" fill="#edf5ff" font-size="21" font-weight="600">Recorder alert email</text><text x="119" y="163" fill="#acbed2" font-size="15">Process device and alarm information</text><path d="M360 196 V218" stroke="#6fc4d9" stroke-width="2" marker-end="url(#arrow)"/><rect x="52" y="225" width="616" height="92" rx="15" fill="#142030" stroke="#365166"/><text x="78" y="256" fill="#89d5ed" font-size="13" font-weight="700">02</text><text x="119" y="260" fill="#edf5ff" font-size="21" font-weight="600">Microsoft Teams notification</text><text x="119" y="288" fill="#acbed2" font-size="15">Notify the responsible operational roles</text><path d="M360 321 V343" stroke="#6fc4d9" stroke-width="2" marker-end="url(#arrow)"/><rect x="52" y="350" width="616" height="92" rx="15" fill="#142030" stroke="#365166"/><text x="78" y="381" fill="#89d5ed" font-size="13" font-weight="700">03</text><text x="119" y="385" fill="#edf5ff" font-size="21" font-weight="600">FastAPI acknowledgment</text><text x="119" y="413" fill="#acbed2" font-size="15">A technician claims or acknowledges the alert</text><path d="M360 446 V468" stroke="#6fc4d9" stroke-width="2" marker-end="url(#arrow)"/><rect x="52" y="475" width="616" height="92" rx="15" fill="#15313d" stroke="#365166"/><text x="78" y="506" fill="#89d5ed" font-size="13" font-weight="700">04</text><text x="119" y="510" fill="#edf5ff" font-size="21" font-weight="600">Follow-up and resolution</text><text x="119" y="538" fill="#acbed2" font-size="15">Escalate when unanswered; log the audit trail</text><text x="52" y="586" font-size="12" fill="#8499b2">Simplified workflow · Company-neutral overview</text></g></svg>